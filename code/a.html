<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>جلب بيانات SHIB/USDT - الوقت الحقيقي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            direction: rtl;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px 15px;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        h2 {
            margin-top: 20px;
            color: #333;
        }
        #currentPrice {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 5px;
            display: inline-block;
        }
        .price-up {
            color: #28a745;
        }
        .price-down {
            color: #dc3545;
        }
        .status {
            margin: 10px 0;
            padding: 8px;
            border-radius: 5px;
        }
        .status.connected {
            background-color: #d4edda;
            color: #155724;
        }
        .status.disconnected {
            background-color: #f8d7da;
            color: #721c24;
        }
        #lastUpdate {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 20px;
        }
        .order-book-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .order-book-section {
            flex: 1;
        }
        .asks-table tr:hover {
            background-color: #ffebee;
        }
        .bids-table tr:hover {
            background-color: #e8f5e9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>دفتر الطلبات SHIB/USDT - الوقت الحقيقي</h1>
        
        <div id="status" class="status disconnected">✗ غير متصل بالسيرفر</div>
        <div id="lastUpdate">آخر تحديث: --/--/---- --:--:--</div>
        
        <!-- عرض السعر الحالي -->
        <div id="currentPrice">السعر الحالي: جاري التحميل...</div>
        
        <div class="order-book-container">
            <div class="order-book-section">
                <h3>أوامر البيع (Asks)</h3>
                <table class="asks-table" id="asksTable">
                    <thead>
                        <tr>
                            <th>السعر (USDT)</th>
                            <th>الكمية (SHIB)</th>
                            <th>القيمة (USDT)</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            
            <div class="order-book-section">
                <h3>أوامر الشراء (Bids)</h3>
                <table class="bids-table" id="bidsTable">
                    <thead>
                        <tr>
                            <th>السعر (USDT)</th>
                            <th>الكمية (SHIB)</th>
                            <th>القيمة (USDT)</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        
        <div id="totalsDisplay"></div>
    </div>

<script>
    // المتغيرات العامة
    let lastPrice = 0;
    let socket = null;
    const symbol = 'SHIBUSDT';
    
    // عناصر DOM
    const currentPriceEl = document.getElementById('currentPrice');
    const statusEl = document.getElementById('status');
    const lastUpdateEl = document.getElementById('lastUpdate');
    
    // دالة تنسيق الأرقام
    function formatNumber(num, decimals = 4) {
        if (num >= 1_000_000_000) {
            return (num / 1_000_000_000).toFixed(decimals) + 'B';
        } else if (num >= 1_000_000) {
            return (num / 1_000_000).toFixed(decimals) + 'M';
        } else if (num >= 1_000) {
            return (num / 1_000).toFixed(decimals) + 'K';
        } else {
            return num.toFixed(decimals);
        }
    }
    
    // دالة تحديث الجدول
    function updateTable(tableId, data, isAsks = false) {
        const tbody = document.querySelector(`#${tableId} tbody`);
        tbody.innerHTML = '';
        
        data.forEach(([price, amount]) => {
            const priceNum = parseFloat(price);
            const amountNum = parseFloat(amount);
            const total = priceNum * amountNum;
            
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${priceNum.toFixed(8)}</td>
                <td>${formatNumber(amountNum, 2)}</td>
                <td>${formatNumber(total, 6)}</td>
            `;
            
            if (isAsks) {
                row.style.color = '#dc3545'; // أحمر للعروض
            } else {
                row.style.color = '#28a745'; // أخضر للطلبات
            }
            
            tbody.appendChild(row);
        });
    }
    
    // دالة حساب الإجماليات
    function calculateTotals(bids, asks) {
        const totalBids = bids.reduce((sum, [price, qty]) => sum + parseFloat(price) * parseFloat(qty), 0);
        const totalAsks = asks.reduce((sum, [price, qty]) => sum + parseFloat(price) * parseFloat(qty), 0);
        const totalAll = totalBids + totalAsks;
        
        document.getElementById('totalsDisplay').innerHTML = `
            <h3>📊 ملخص الإجماليات</h3>
            <table>
                <thead>
                    <tr>
                        <th>النوع</th>
                        <th>الإجمالي (USDT)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>إجمالي الطلبات (Bids)</td>
                        <td>${formatNumber(totalBids, 2)}</td>
                    </tr>
                    <tr>
                        <td>إجمالي العروض (Asks)</td>
                        <td>${formatNumber(totalAsks, 2)}</td>
                    </tr>
                    <tr>
                        <td><strong>الإجمالي الكلي</strong></td>
                        <td><strong>${formatNumber(totalAll, 2)}</strong></td>
                    </tr>
                </tbody>
            </table>
        `;
    }
    
    // دالة تحديث السعر الحالي
    function updateCurrentPrice(price) {
        const priceNum = parseFloat(price);
        
        if (lastPrice > 0) {
            if (priceNum > lastPrice) {
                currentPriceEl.className = 'price-up';
            } else if (priceNum < lastPrice) {
                currentPriceEl.className = 'price-down';
            }
        }
        
        currentPriceEl.textContent = `السعر الحالي: ${priceNum.toFixed(8)} USDT`;
        lastPrice = priceNum;
    }
    
    // دالة تحديث وقت التحديث الأخير
    function updateLastUpdateTime() {
        const now = new Date();
        const timeStr = now.toLocaleString('ar-EG', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: true
        });
        
        lastUpdateEl.textContent = `آخر تحديث: ${timeStr}`;
    }
    
    // دالة الاتصال بـ WebSocket
    function connectWebSocket() {
        // إغلاق الاتصال الحالي إذا كان موجوداً
        if (socket) {
            socket.close();
        }
        
        // إنشاء اتصال WebSocket جديد
        socket = new WebSocket('wss://wbs.mexc.com/ws');
        
        socket.onopen = function() {
            statusEl.className = 'status connected';
            statusEl.textContent = '✓ متصل بالسيرفر';
            
            // الاشتراك في تحديثات دفتر الطلبات
            const subscribeMsg = {
                method: "SUBSCRIPTION",
                params: [`spot@public.depth.v3.api@${symbol}`]
            };
            socket.send(JSON.stringify(subscribeMsg));
            
            // الاشتراك في تحديثات السعر
            const priceSubscribeMsg = {
                method: "SUBSCRIPTION",
                params: [`spot@public.deals.v3.api@${symbol}`]
            };
            socket.send(JSON.stringify(priceSubscribeMsg));
        };
        
        socket.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            if (data && data.d) {
                // تحديث دفتر الطلبات
                if (data.c && data.c.includes('depth.v3.api')) {
                    const orderBook = data.d;
                    updateTable('asksTable', orderBook.asks, true);
                    updateTable('bidsTable', orderBook.bids);
                    calculateTotals(orderBook.bids, orderBook.asks);
                    updateLastUpdateTime();
                }
                
                // تحديث السعر الحالي
                if (data.c && data.c.includes('deals.v3.api')) {
                    const trades = data.d.deals;
                    if (trades && trades.length > 0) {
                        const lastTrade = trades[trades.length - 1];
                        updateCurrentPrice(lastTrade.p);
                    }
                }
            }
        };
        
        socket.onerror = function(error) {
            console.error('WebSocket Error:', error);
            statusEl.className = 'status disconnected';
            statusEl.textContent = '✗ خطأ في الاتصال بالسيرفر';
        };
        
        socket.onclose = function() {
            statusEl.className = 'status disconnected';
            statusEl.textContent = '✗ تم قطع الاتصال بالسيرفر';
            
            // إعادة الاتصال بعد ثانية
            setTimeout(connectWebSocket, 1000);
        };
    }
    
    // بدء التحميل عند تحميل الصفحة
    window.addEventListener('DOMContentLoaded', function() {
        connectWebSocket();
        
        // جلب البيانات الأولية باستخدام REST API
        fetchInitialData();
    });
    
    // دالة جلب البيانات الأولية
    async function fetchInitialData() {
        try {
            const apiURL = `https://api.mexc.com/api/v3/depth?symbol=${symbol}&limit=10`;
            const proxyURL = `http://localhost:8089/proxy.php?url=${encodeURIComponent(apiURL)}`;
            
            const response = await fetch(proxyURL);
            if (!response.ok) throw new Error('فشل في جلب البيانات');
            
            const data = await response.json();
            
            updateTable('asksTable', data.asks, true);
            updateTable('bidsTable', data.bids);
            calculateTotals(data.bids, data.asks);
            
            // جلب السعر الحالي
            const priceURL = `https://api.mexc.com/api/v3/ticker/price?symbol=${symbol}`;
            const priceProxyURL = `http://localhost:8089/proxy.php?url=${encodeURIComponent(priceURL)}`;
            
            const priceRes = await fetch(priceProxyURL);
            if (!priceRes.ok) throw new Error('فشل في جلب السعر');
            
            const priceData = await priceRes.json();
            updateCurrentPrice(priceData.price);
            
            updateLastUpdateTime();
        } catch (error) {
            console.error('Error:', error);
        }
    }
</script>
</body>
</html>
